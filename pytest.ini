[pytest]
testpaths = tests
# Later entries take precedence.  The ignored warnings are not caused by
# xdot: the first two come from PyGObject itself (3.56, Python 3.14), the
# last from pytest-xdist about pytest-cov's use of rsyncdirs (coverage.sh).
filterwarnings =
    error::DeprecationWarning
    ignore:GLib.unix_signal_add_full is deprecated:DeprecationWarning
    ignore:'asyncio\.:DeprecationWarning
    ignore:The --rsyncdir command line argument:DeprecationWarning
